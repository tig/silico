name: ci

# Host always / metal later — silico/knowledge/ci-host-metal.md (tig/silico#101)
on:
  push:
  pull_request:
  workflow_dispatch:

# C plate host path on CI:
#   1) cmake host_test (pure C; no silico required for that step)
#   2) silico gate include-hygiene (+ [host].gate) via sibling tig/silico checkout
# product-path still wants a local pin; gate covers the HAL boundary Codex flagged on #77.
jobs:
  host-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gcu
    steps:
      - name: Checkout GCU
        uses: actions/checkout@v4
        with:
          path: gcu
      - name: Checkout silico (sibling host spine)
        uses: actions/checkout@v4
        with:
          repository: tig/silico
          path: silico
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install silico (editable) + bedside
        run: |
          python -m pip install -U pip
          python -m pip install -e ../silico
          python -m pip install -e ../silico/third_party/bedside
      - name: Configure host tests
        run: cmake -S host -B build/host
      - name: CMake host_test
        run: cmake --build build/host --target host_test
      - name: silico gate (include hygiene + host.gate)
        run: silico gate

  # Opt-in self-hosted metal plane. Unset SILICO_METAL_CI → job skipped (host always is enough).
  # When true: register a runner labeled [self-hosted, silico-metal] and replace the stub step
  # with wait-device → inspect → idf-flash/deploy → machine accept (see ci-host-metal.md).
  metal-bench:
    name: metal-bench
    needs: host-gate
    if: ${{ vars.SILICO_METAL_CI == 'true' }}
    runs-on: [self-hosted, silico-metal]
    concurrency:
      group: silico-metal-${{ github.repository }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: gcu
    steps:
      - name: Checkout GCU
        uses: actions/checkout@v4
        with:
          path: gcu
      - name: Checkout silico (sibling host spine)
        uses: actions/checkout@v4
        with:
          repository: tig/silico
          path: silico
      - name: Metal plane stub (wire me)
        run: |
          echo "::error::SILICO_METAL_CI is true but metal-bench steps are not wired yet."
          echo "See tig/silico silico/knowledge/ci-host-metal.md — host-gate alone is the always-on plane."
          echo "Replace this step with: wait-device, inspect, idf build/flash or silico deploy, machine accept."
          exit 1
