[[segments]]
id = "desk-metal"
kind = "clip"
source = "footage/04-desk-xuss-boot-demo.mp4"
speed = 1.0
session_start_sec = 2400
session_end_sec = 2520
show_clock = true
keep_audio = true
note = "Desk: boot sound, product face, short demo."

[[segments]]
id = "ci-green"
kind = "clip"
source = "footage/05-xuss-ci-green.mp4"
speed = 1.0
session_start_sec = 2520
session_end_sec = 2580
show_clock = true
keep_audio = false
note = "tig/xuss CI green on main."

[[segments]]
id = "credits"
kind = "card"
duration_sec = 4.0
session_start_sec = 2580
session_end_sec = 2580
show_clock = false
lines = ["https://github.com/tig/silico"]
subtitle = "Prompt to metal."
