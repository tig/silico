name: ci

# Host always / metal later — silico/knowledge/ci-host-metal.md (tig/silico#101)
on:
  push:
  pull_request:
  workflow_dispatch:

# Layout matches first ship host pin in requirements-dev.txt (-e ../silico):
#   $GITHUB_WORKSPACE/gcu      ← this product repo
#   $GITHUB_WORKSPACE/silico   ← tig/silico host spine
jobs:
  host-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gcu
    steps:
      - name: Checkout GCU
        uses: actions/checkout@v4
        with:
          path: gcu
      - name: Checkout silico (sibling host spine)
        uses: actions/checkout@v4
        with:
          repository: tig/silico
          path: silico
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install host deps
        run: |
          python -m pip install -U pip
          # Same pin as first ship: requirements-dev.txt has -e ../silico
          python -m pip install -r requirements-dev.txt
          python -m pip install -e ../silico/third_party/bedside
      - name: Host gate
        run: python -m pytest -q

  # Opt-in self-hosted metal plane. Unset SILICO_METAL_CI → job skipped (host always is enough).
  # When true: register a runner labeled [self-hosted, silico-metal] and replace the stub step
  # with wait-device → inspect → deploy --yes --verify → machine accept (see ci-host-metal.md).
  metal-bench:
    name: metal-bench
    needs: host-gate
    if: ${{ vars.SILICO_METAL_CI == 'true' }}
    runs-on: [self-hosted, silico-metal]
    concurrency:
      group: silico-metal-${{ github.repository }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: gcu
    steps:
      - name: Checkout GCU
        uses: actions/checkout@v4
        with:
          path: gcu
      - name: Checkout silico (sibling host spine)
        uses: actions/checkout@v4
        with:
          repository: tig/silico
          path: silico
      - name: Metal plane stub (wire me)
        run: |
          echo "::error::SILICO_METAL_CI is true but metal-bench steps are not wired yet."
          echo "See tig/silico silico/knowledge/ci-host-metal.md — host-gate alone is the always-on plane."
          echo "Replace this step with: wait-device, inspect, deploy --yes --verify, machine accept."
          exit 1
